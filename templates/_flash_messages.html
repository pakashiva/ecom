{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-stack" role="region" aria-label="Notifications">
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">
                    <span class="flash-message-text">{{ message }}</span>
                    <button class="flash-dismiss" type="button" aria-label="Dismiss notification" data-flash-dismiss>&times;</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
